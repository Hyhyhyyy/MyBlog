  <style>
    /* 单屏布局：整页禁止下滑，仅 InfiniteMenu 容器为全屏交互 */
    html, body { height: 100%; }
    body.collections-page {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin: 0;
    }
    .collections-page .nav { flex: 0 0 auto; }
    .im-page {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      /* 底部留出 72px 给 fixed bottom-nav，避免 action-button 叠在导航上 */
      padding-bottom: 72px;
      box-sizing: border-box;
    }
    .im-page .page-head {
      flex: 0 0 auto;
      padding: 10px 22px 4px;
    }
    .im-page .page-head .eyebrow {
      margin: 0 0 2px;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--black, #000);
      opacity: 0.7;
    }
    .im-page .page-head h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 900;
      color: var(--black, #000);
      letter-spacing: -0.01em;
    }
    .im-page #im-root {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
