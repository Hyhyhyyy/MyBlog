<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABOUT / 关于 — HYHY</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="gooey-nav.css" />
  <link rel="stylesheet" href="flowing-menu.css" />
  <link rel="stylesheet" href="text-pressure.css" />
</head>
<body class="about-page">

  <!-- 导航（与全站一致，当前页“关于”高亮） -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">HYHY / GROWTH</a>
      <div class="nav-links" data-gooey-nav></div>
    </div>
  </nav>

  <main class="about-main">

    <!-- TextPressure 标题（React Bits 原生移植）：鼠标靠近字符，字重/字宽/斜体随距离变化 -->
    <section class="tp-section">
      <div id="text-pressure"></div>
    </section>

    <!-- 番茄流动菜单（FlowingMenu 原生移植） -->
    <section class="flowing-section">
      <div id="flowing-menu"></div>
    </section>

  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-inner">
      <div>
        <h4>HYHY / GROWTH</h4>
        <p class="tag">Neo-Brutalist 原型 · 关于页占位</p>
      </div>
      <div>
        <ul>
          <li><a href="index.html">首页</a></li>
          <li><a href="study.html">学习</a></li>
          <li><a href="projects.html">项目</a></li>
          <li><a href="collections.html">娱乐</a></li>
        </ul>
      </div>
      <div>
        <ul>
          <li><a href="about.html">关于</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <!-- gsap（UMD，全局 gsap）必须在 flowing-menu.js 之前加载 -->
  <script src="gsap.min.js"></script>
  <script src="gooey-nav.js"></script>
  <script src="text-pressure.js"></script>
  <script src="flowing-menu.js"></script>
  <script>
    // TextPressure 标题：白色 Hello!，鼠标靠近字符时字重/字宽/斜体随距离变化
    (function () {
      'use strict';
      var tp = document.getElementById('text-pressure');
      if (tp && typeof window.TextPressureInit === 'function') {
        window.TextPressureInit(tp, {
          text: 'Hello!',
          flex: true,
          alpha: false,
          stroke: false,
          width: true,
          weight: true,
          italic: true,
          textColor: '#000000',
          minFontSize: 36
        });
      }
    })();

    // 番茄流动菜单：四行各一个番茄系配色，文字先占位，效果优先
    (function () {
      'use strict';
      var tomatoItems = [
        { text: '番茄宣言', link: '#', shade: '#FF6347', marqueeText: '#1a1a1a', imgA: '#FF8A65', imgB: '#E53935' },
        { text: '珊瑚漫游', link: '#', shade: '#FF7F50', marqueeText: '#1a1a1a', imgA: '#FFB74D', imgB: '#F4511E' },
        { text: '深红档案', link: '#', shade: '#DC143C', marqueeText: '#ffffff', imgA: '#FF5252', imgB: '#B71C1C' },
        { text: '鲑鱼物语', link: '#', shade: '#FA8072', marqueeText: '#1a1a1a', imgA: '#FFAB91', imgB: '#E64A19' }
      ];
      function bootMenu() {
        var box = document.getElementById('flowing-menu');
        if (!box || typeof window.FlowingMenuInit !== 'function') return;
        window.FlowingMenuInit(box, tomatoItems, { speed: 14 });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootMenu);
      } else { bootMenu(); }
    })();
  </script>
</body>
</html>
