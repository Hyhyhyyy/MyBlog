<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYHY · Growth Archive — Neo-Brutalist Prototype</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="drift-wall.css" />
  <link rel="stylesheet" href="magic-bento.css" />
  <link rel="stylesheet" href="gooey-nav.css" />
  <link rel="stylesheet" href="lanyard.css" />
  <link rel="stylesheet" href="target-cursor.css" />
  <link rel="stylesheet" href="DotField.css" />
</head>
<body class="home">

  <!-- ===== 主页背景：DotField 点阵（固定铺满视口，置于内容之下） ===== -->
  <div class="dot-field-bg" id="dot-field-bg" aria-hidden="true"></div>

  <!-- ===== 导航（保留博客架构） ===== -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">HYHY / GROWTH</a>
      <div class="nav-links" data-gooey-nav></div>
    </div>
  </nav>

  <div class="main">

  <!-- ===== 交互档案（MagicBento） ===== -->
  <section class="section">
    <div class="section-inner">
      <div id="bento"></div>
    </div>
  </section>

  <!-- ===== Hero 身份卡（物理引擎 Lanyard，完整可拉伸绳子） ===== -->
  <section class="hero">
    <!-- Lanyard 物理名片（React Bits 物理版）：Rapier + Three.js 渲染完整可拉伸绳子 -->
    <div class="lanyard-slot">
      <div id="lanyard-root"></div>
    </div>
  </section>

  </div><!-- /.main -->

  <script src="gsap.min.js"></script>
  <script src="gooey-nav.js"></script>
  <script src="magic-bento.js"></script>
  <!-- 主页背景：DotField 点阵（React Bits 原生移植，取代纯白底；
       鼠标附近点向外凸起 + 微光跟随，静止时回落为静态点阵） -->
  <script src="DotField.js"></script>
  <script>
    (function () {
      'use strict';
      function boot() {
        var c = document.getElementById('dot-field-bg');
        if (!c || typeof window.DotFieldInit !== 'function') return;
        window.DotFieldInit(c, {
          dotRadius: 22,
          dotSpacing: 26,
          cursorRadius: 500,
          bulgeStrength: 67,
          glowRadius: 160,
          dotImage: 'assets/tomato.png',
          /* gradient 字段为图片模式下的回退色，此处不生效 */
          gradientFrom: 'rgba(255,0,0,0.95)',
          gradientTo: 'rgba(255,0,0,0.95)',
          glowColor: 'rgba(0,0,0,0.10)'
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else { boot(); }
    })();
  </script>
  <!-- Lanyard 物理名片：延迟到 DOM 解析完成后再加载，
       避免 3MB JS + 1.4MB wasm 阻塞首屏渲染（首屏先显示其余内容，名片随后“长”出）。 -->
  <script>
    window.__LANYARD_WASM_BASE__ = new URL('./lanyard-dist/assets/', location.href).href;
    function loadLanyard() {
      if (window.__lanyardLoaded) return;
      window.__lanyardLoaded = true;
      var s = document.createElement('script');
      s.src = 'lanyard-dist/assets/lanyard.js';
      s.async = true;
      document.body.appendChild(s);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { setTimeout(loadLanyard, 100); });
    } else {
      setTimeout(loadLanyard, 100);
    }
  </script>
  <!-- 全站绿色鼠标特效（React Bits TargetCursor 原生移植） -->
  <script src="target-cursor.js"></script>
  <script>
    if (typeof window.TargetCursorInit === 'function') {
      window.TargetCursorInit({ cursorColor: '#1FD17B', hideDefaultCursor: true, spinDuration: 2 });
    }
  </script>

</body>
</html>
