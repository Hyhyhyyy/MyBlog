<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 / 页面走丢了 — HYHY</title>
  <meta name="description" content="页面未找到 — HYHY · Growth Archive 娱乐合集原型站。" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="a11y.css" />
  <style>
    :root{ --red:#FF4438; --green:#1FD17B; --black:#000; --white:#fff; --mono:ui-monospace,Menlo,Consolas,monospace; --heavy:"Arial Black",Arial,Helvetica,sans-serif; }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
          background:var(--white); color:var(--black); font-family:var(--mono); }
    .box{ border:4px solid var(--black); box-shadow:8px 8px 0 var(--black); background:var(--white);
          padding:48px; max-width:520px; text-align:center; }
    .code{ font-family:var(--heavy); font-weight:900; font-size:120px; line-height:.9; margin:0; color:var(--red); }
    h1{ font-family:var(--heavy); font-weight:900; font-size:28px; margin:12px 0 16px; }
    p{ font-size:15px; line-height:1.6; margin:0 0 28px; }
    a.btn{ display:inline-block; font-family:var(--heavy); font-weight:900; font-size:18px;
           border:3px solid var(--black); box-shadow:4px 4px 0 var(--black);
           background:var(--black); color:var(--white); padding:14px 26px; text-decoration:none; }
    a.btn:hover{ box-shadow:none; transform:translate(2px,2px); }
  </style>
</head>
<body>
  <main class="box">
    <p class="code">404</p>
    <h1>页面走丢了</h1>
    <p>你访问的页面不存在或已被移动。回到主页继续逛逛娱乐合集吧。</p>
    <a class="btn" href="index.html">← 返回主页</a>
  </main>
</body>
</html>
