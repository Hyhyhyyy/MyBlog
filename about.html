  <script>
    // TextPressure 标题：白色 Hello!，鼠标靠近字符时字重/字宽/斜体随距离变化
    (function () {
      'use strict';
      var tp = document.getElementById('text-pressure');
      if (tp && typeof window.TextPressureInit === 'function') {
        window.TextPressureInit(tp, {
          text: 'Hello!',
          flex: true,
          alpha: false,
          stroke: false,
          width: true,
          weight: true,
          italic: true,
          textColor: '#000000',
          minFontSize: 36
        });
      }
    })();

    // 番茄流动菜单：四行各一个番茄系配色，文字先占位，效果优先
    (function () {
      'use strict';
      var tomatoItems = [
        { text: '番茄宣言', link: '#', shade: '#FF6347', marqueeText: '#1a1a1a', imgA: '#FF8A65', imgB: '#E53935' },
        { text: '珊瑚漫游', link: '#', shade: '#FF7F50', marqueeText: '#1a1a1a', imgA: '#FFB74D', imgB: '#F4511E' },
        { text: '深红档案', link: '#', shade: '#DC143C', marqueeText: '#ffffff', imgA: '#FF5252', imgB: '#B71C1C' },
        { text: '鲑鱼物语', link: '#', shade: '#FA8072', marqueeText: '#1a1a1a', imgA: '#FFAB91', imgB: '#E64A19' }
      ];
      function bootMenu() {
        var box = document.getElementById('flowing-menu');
        if (!box || typeof window.FlowingMenuInit !== 'function') return;
        window.FlowingMenuInit(box, tomatoItems, { speed: 14 });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootMenu);
      } else { bootMenu(); }
    })();
  </script>
