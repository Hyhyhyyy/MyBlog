  <script>
    // TextPressure 标题：白色文字，鼠标靠近字符时字重/字宽/斜体随距离变化
    (function () {
      'use strict';
      function initTP(id, text) {
        var tp = document.getElementById(id);
        if (tp && typeof window.TextPressureInit === 'function') {
          window.TextPressureInit(tp, {
            text: text,
            flex: true,
            alpha: false,
            stroke: false,
            width: true,
            weight: true,
            italic: true,
            textColor: '#000000',
            minFontSize: 36
          });
        }
      }
      initTP('text-pressure', 'HELLO! NICE TO MEET YOU!');
      initTP('text-pressure-2', 'WELCOME TO MY BLOG!');
    })();

    // 黑白流动菜单：静态白底黑字（shade=黑，控制静止文字/边框与动态黑底）；
    // 动态黑底白字（marqueeText=白）。imgText 取代原渐变长方形色块位置显示文字。
    (function () {
      'use strict';
      var aboutItems = [
        { text: 'I AM',    link: '#', shade: '#000000', marqueeText: '#ffffff', imgText: 'HY' },
        { text: "I'M FROM", link: '#', shade: '#000000', marqueeText: '#ffffff', imgText: 'BNDS&DUT' },
        { text: 'I LIKE',  link: '#', shade: '#000000', marqueeText: '#ffffff', imgText: 'COMMUNICATION&COOPERATION' }
      ];
      function bootMenu() {
        var box = document.getElementById('flowing-menu');
        if (!box || typeof window.FlowingMenuInit !== 'function') return;
        window.FlowingMenuInit(box, aboutItems, { speed: 14 });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootMenu);
      } else { bootMenu(); }
    })();
  </script>

  <!-- hyhy-sw -->
  <script>
    if ('serviceWorker' in navigator) {
      if (location.search.indexOf('nocache') !== -1) {
        // 调试开关：清除本作用域所有 Service Worker 并去掉参数重载，确保看到最新资源
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          var u = new URL(location.href);
          u.searchParams.delete('nocache');
          location.replace(u.toString());
        }).catch(function () {
          var u = new URL(location.href);
          u.searchParams.delete('nocache');
          location.replace(u.toString());
        });
      } else {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    }
  </script>
