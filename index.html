<body class="home">
  <!-- hyhy-skip -->

  <!-- ===== 主页背景：循环视频（默认静音播放，可一键开关声音） ===== -->

  </video>

          aria-pressed="false" aria-label="开关背景视频声音">🔇</button>

  <!-- ===== 导航（保留博客架构） ===== -->

  <!-- hyhy-search -->
  <div class="site-search" role="search">

  <!-- A2：自定义光标开关（仅桌面默认开启，可一键关闭并记忆偏好） -->
  <button id="cursor-toggle" class="cursor-toggle" type="button"
          aria-pressed="false" aria-label="切换自定义鼠标指针（绿色光标）">光标: 开</button>

  <div class="main">

  <!-- U3：大动画加载骨架屏（DotField / Lanyard 就绪后移除） -->
  <div class="skeleton" id="home-skeleton" aria-hidden="true"></div>

  <!-- ===== 交互档案（MagicBento） ===== -->
  <section class="section" id="main">
    <div class="section-inner">
      <div id="bento"></div>
    </div>
  </section>

  <!-- ===== Hero 身份卡（物理引擎 Lanyard，完整可拉伸绳子） ===== -->
  <section class="hero">
    <!-- Lanyard 物理名片（React Bits 物理版）：Rapier + Three.js 渲染完整可拉伸绳子 -->
      <div class="lanyard-slot">
        <!-- A6：物理名片是装饰性交互玩具，无等价文本意义，对辅助技术隐藏 -->
        <div id="lanyard-root" aria-hidden="true"></div>
      </div>
  </section>

  </div><!-- /.main -->

  <!-- 外部脚本全部 defer：与 HTML 解析并行下载，执行顺序保留（gsap 先于依赖它的脚本），
       不阻塞首屏渲染。gsap 被 magic-bento / target-cursor / projects / flowing-menu 实际使用，保留。 -->
  <script defer src="gsap.min.js"></script>
  <script defer src="liquid-glass.js"></script>
  <script defer src="liquid-glass-wrap.js"></script>
  <script defer src="gooey-nav.js"></script>
  <script defer src="magic-bento.js"></script>
  <!-- Lanyard 物理引擎 wasm 的 base：必须在 lanyard.js 执行前设置（内联、解析期运行，早于 defer 脚本） -->
  <script>window.__LANYARD_WASM_BASE__ = new URL('./lanyard-dist/assets/', location.href).href;</script>
  <script defer src="lanyard-dist/assets/lanyard.js"></script>
  <script defer src="target-cursor.js"></script>
  <!-- 所有依赖库均 defer，在 DOMContentLoaded 前已就绪；统一在此初始化（A1/A2） -->
  <script>
    (function () {
      'use strict';
      var mq = window.matchMedia;
      var reduce = mq && mq('(prefers-reduced-motion: reduce)').matches;
      var finePointer = mq && mq('(hover: hover) and (pointer: fine)').matches;
      var cursorOff = false;
      try { cursorOff = localStorage.getItem('hyhy_cursor_off') === '1'; } catch (e) {}
      document.addEventListener('DOMContentLoaded', function () {
        // U3：大动画（DotField / Lanyard）就绪后移除骨架屏
        window.addEventListener('load', function () {
          var sk = document.getElementById('home-skeleton');
          if (sk) sk.classList.add('hidden');
        });
        // 把 shuding/liquid-glass 效果套到顶部导航和所有 Bento 卡片上。
        // 卡片由 magic-bento.js 在 defer 阶段创建，等到 DOMContentLoaded 才存在；
        // 再用 rAF 多跑一次兜底，错过的元素也能补上。
        // 玻璃效果：magnify:false → 纯磨砂质感（无放大/扭曲），视频清晰透出。
        function applyLiquidGlassOnce() {
          if (typeof window.applyGlassOnce !== 'function') return false;
          var nav = document.querySelector('.nav');
          window.applyGlassOnce(nav, {
            magnify: false,
            blur: 8,
            saturate: 1.1,
            brightness: 1.03,
            tint: 'rgba(255,255,255,0.04)'
          });
          var cards = document.querySelectorAll('.magic-bento-card');
          for (var k = 0; k < cards.length; k++) {
            window.applyGlassOnce(cards[k], {
              magnify: false,
              borderRadius: '20px',
              blur: 9,
              saturate: 1.12,
              brightness: 1.03,
              tint: 'rgba(255,255,255,0.05)'
            });
          }
          return !!(nav && cards.length > 0);
        }
        applyLiquidGlassOnce();
        requestAnimationFrame(function () { applyLiquidGlassOnce(); });
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { applyLiquidGlassOnce(); });
        });
        /* 主页背景视频：浏览器自动播放策略默认拒绝带声音的 autoplay，
           所以默认 muted；点击左下🔇按钮可启用声音（用户手势后浏览器放行），
           选择写入 localStorage 跨刷新记忆。 */
        (function () {
          var v = document.getElementById('bg-video');
          var btn = document.getElementById('sound-toggle');
          if (!v || !btn) return;
          var saved = null;
          try { saved = localStorage.getItem('hyhy_bg_sound'); } catch (e) {}
          function applyIcon() {
            btn.textContent = v.muted ? '🔇' : '🔊';
            btn.setAttribute('aria-pressed', v.muted ? 'false' : 'true');
            btn.setAttribute('aria-label', v.muted ? '开启背景视频声音' : '关闭背景视频声音');
          }
          if (saved === '1') { v.muted = false; }
          applyIcon();
          btn.addEventListener('click', function () {
            v.muted = !v.muted;
            try { localStorage.setItem('hyhy_bg_sound', v.muted ? '0' : '1'); } catch (e) {}
            applyIcon();
            var p = v.play();
            if (p && typeof p.catch === 'function') p.catch(function () {});
          });
          var pp = v.play();
          if (pp && typeof pp.catch === 'function') pp.catch(function () {});
        })();
        // TargetCursor 绿色鼠标：仅精细指针（桌面）默认开启，且可被用户关闭；
        // reduced-motion 下不隐藏系统光标、不做旋转动画
        if (typeof window.TargetCursorInit === 'function' && finePointer && !cursorOff) {
          window.TargetCursorInit({ cursorColor: '#1FD17B', hideDefaultCursor: !reduce, spinDuration: 2 });
        }
        // 自定义光标开关（A2）
        var toggle = document.getElementById('cursor-toggle');
        if (toggle) {
          var syncLabel = function () { toggle.textContent = cursorOff ? '光标: 关' : '光标: 开'; };
          syncLabel();
          toggle.setAttribute('aria-pressed', cursorOff ? 'true' : 'false');
          toggle.addEventListener('click', function () {
            cursorOff = !cursorOff;
            try { localStorage.setItem('hyhy_cursor_off', cursorOff ? '1' : '0'); } catch (e) {}
            toggle.setAttribute('aria-pressed', cursorOff ? 'true' : 'false');
            syncLabel();
            location.reload();
          });
        }
      });
    })();
  </script>


  <!-- hyhy-sw -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>

  <!-- hyhy-theme -->
  <script>
    (function () {
      var root = document.documentElement;
      var saved = null;
      try { saved = localStorage.getItem('hyhy_theme'); } catch (e) {}
      if (saved === 'dark') root.setAttribute('data-theme', 'dark');
      var btn = document.getElementById('theme-toggle');
      if (btn) {
        var sync = function () {
          var d = root.getAttribute('data-theme') === 'dark';
          btn.textContent = d ? '浅色' : '深色';
          btn.setAttribute('aria-pressed', d ? 'true' : 'false');
        };
        sync();
        btn.addEventListener('click', function () {
          var d = root.getAttribute('data-theme') !== 'dark';
          if (d) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
          try { localStorage.setItem('hyhy_theme', d ? 'dark' : 'light'); } catch (e) {}
          sync();
        });
      }
    })();
  </script>
