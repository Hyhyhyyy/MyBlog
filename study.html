  <style>
    html, body { height: 100%; }
    body.study-page {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--white);
    }
    .study-page .nav { flex: 0 0 auto; }
    .study-main {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }
    .study-split {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
    }
    .study-left {
      flex: 5 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .study-head {
      flex: 0 0 auto;
      padding: 16px 24px 0;
    }
    .study-head .eyebrow {
      margin-bottom: 4px;
      color: var(--black);
    }
    .study-head h2 {
      font-family: var(--heavy);
      font-weight: 900;
      letter-spacing: -.02em;
      font-size: clamp(28px, 4vw, 48px);
      margin: 0 0 14px;
      color: var(--black);
    }
    /* 左侧：全部文章的可拖拽列表；拖动画布即可上下浏览找到对应圆 */
    .blog-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 24px 96px;
      cursor: grab;
      touch-action: pan-y;
    }
    .blog-list.dragging { cursor: grabbing; }
    .post-row {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 4px;
      border-bottom: 2px dashed rgba(0,0,0,.18);
      user-select: none;
    }
    .post-date {
      flex: 0 0 92px;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--black);
      text-align: right;
      white-space: nowrap;
    }
    /* 圆：取封面最大内切同心圆 */
    .post-circle {
      flex: 0 0 auto;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--black);
      box-shadow: 5px 5px 0 var(--black);
      background: var(--white);
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .post-circle:hover {
      transform: translate(-2px,-2px);
      box-shadow: 8px 8px 0 var(--black);
    }
    .post-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .post-info { flex: 1 1 auto; min-width: 0; }
    .post-title {
      font-family: var(--heavy);
      font-weight: 900;
      font-size: 18px;
      color: var(--black);
      line-height: 1.2;
    }
    .post-desc {
      font-size: 13px;
      color: var(--black);
      opacity: .7;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .post-cat {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 13px;
      border: 2px solid var(--black);
      padding: 4px 12px;
      border-radius: 999px;
      color: var(--black);
      white-space: nowrap;
    }
    .post-empty {
      padding: 48px 16px;
      text-align: center;
      color: var(--black);
      opacity: .6;
      font-family: var(--mono);
      font-size: 14px;
    }
    /* 右侧：三个文件夹作为分类筛选 */
    .study-right {
      flex: 1 1 0;
      min-width: 0;
      border-left: 4px solid var(--black);
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 24px 12px;
      overflow-y: auto;
    }
    .side-folder {
      cursor: pointer;
      outline: none;
      border-radius: 12px;
      padding: 8px;
      transition: background .15s ease, box-shadow .15s ease;
    }
    .side-folder:hover, .side-folder:focus-visible {
      background: rgba(0,0,0,.05);
    }
    .side-folder.active {
      background: var(--red);
      box-shadow: 0 0 0 3px var(--black);
    }
    .side-folder.active .side-folder__label { color: #fff; }
    .side-folder__label {
      font-family: var(--heavy);
      font-weight: 900;
      font-size: 16px;
      text-align: center;
      margin-top: 6px;
      color: var(--black);
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    @media (max-width: 768px) {
      .study-split { flex-direction: column; }
      .study-right {
        flex-direction: row;
        border-left: none;
        border-top: 4px solid var(--black);
        gap: 18px;
        padding: 12px;
      }
    }

  <script src="gooey-nav.js"></script>
  <script>
    (function () {
      'use strict';
      // 传统博客索引：从 posts/manifest.json 读取全部文章，
      // 左侧列出 [日期 | 圆形封面 | 分类]，可拖拽浏览；右侧三个文件夹按分类筛选。
      var list = document.getElementById('blog-list');
      var folders = Array.prototype.slice.call(document.querySelectorAll('.side-folder'));
      var posts = [];
      var filter = null;

      function render() {
        if (!posts.length) {
          list.innerHTML = '<div class="post-empty">还没有文章。用 blog/new_post.py 新建，再运行 blog/sync.py 上传。</div>';
          return;
        }
        var rows = posts.filter(function (p) { return !filter || p.category === filter; });
        if (!rows.length) {
          list.innerHTML = '<div class="post-empty">「' + filter + '」分类下暂无文章。</div>';
          return;
        }
        list.innerHTML = rows.map(function (p) {
          return '<div class="post-row" data-cat="' + p.category + '">'
            + '<div class="post-date">' + p.date + '</div>'
            + '<a class="post-circle" href="' + p.url + '" aria-label="打开文章：' + p.title + '">'
            +   '<img src="' + p.cover + '" alt="' + p.title + ' 封面" loading="lazy" />'
            + '</a>'
            + '<div class="post-info"><div class="post-title">' + p.title + '</div>'
            +   (p.description ? '<div class="post-desc">' + p.description + '</div>' : '')
            + '</div>'
            + '<div class="post-cat">' + p.category + '</div>'
            + '</div>';
        }).join('');
      }

      // 拖拽浏览：按住列表上下拖动即可滚动，拖动后不触发跳转
      var isDown = false, startY = 0, startTop = 0, moved = false;
      list.addEventListener('pointerdown', function (e) {
        isDown = true; moved = false;
        startY = e.clientY; startTop = list.scrollTop;
        list.classList.add('dragging');
      });
      list.addEventListener('pointermove', function (e) {
        if (!isDown) return;
        var dy = e.clientY - startY;
        if (Math.abs(dy) > 4) moved = true;
        list.scrollTop = startTop - dy;
      });
      function endDrag() { isDown = false; list.classList.remove('dragging'); }
      list.addEventListener('pointerup', endDrag);
      list.addEventListener('pointercancel', endDrag);
      list.addEventListener('click', function (e) {
        if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
      }, true);

      // 右侧文件夹：点击切换分类筛选（再次点击取消）
      folders.forEach(function (f) {
        function toggle() {
          var cat = f.getAttribute('data-cat');
          if (filter === cat) {
            filter = null;
            folders.forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-pressed', 'false'); });
          } else {
            filter = cat;
            folders.forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-pressed', 'false'); });
            f.classList.add('active'); f.setAttribute('aria-pressed', 'true');
          }
          render();
        }
        f.addEventListener('click', toggle);
        f.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
      });

      fetch('posts/manifest.json')
        .then(function (r) { return r.json(); })
        .then(function (m) {
          posts = (m.posts || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
          render();
        })
        .catch(function () {
          list.innerHTML = '<div class="post-empty">无法加载文章列表（posts/manifest.json）。请先运行 blog/sync.py 上传。</div>';
        });
    })();
  </script>
