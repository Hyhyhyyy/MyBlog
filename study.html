<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STUDY / 学习 — HYHY</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="gooey-nav.css" />
  <link rel="stylesheet" href="infinite-menu.css" />
  <link rel="stylesheet" href="folder.css" />
  <style>
    /* 单屏布局：整页禁止下滑，仅 InfiniteMenu 画布填满主区 */
    html, body { height: 100%; }
    body.study-page {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--white);
    }
    .study-page .nav { flex: 0 0 auto; }
    .study-page .study-main {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }
    /* 页面分割：左 5/6 为「原有学习页等比缩小、功能全保留」版，右 1/6 留白待设计 */
    .study-split {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
    }
    .study-left {
      flex: 5 1 0;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    /* 左上角同款标题（与 projects / collections 一致：eyebrow + h2） */
    .study-head {
      flex: 0 0 auto;
      padding: 16px 24px 0;
    }
    .study-head .eyebrow {
      margin-bottom: 4px;
      color: var(--black);
    }
    .study-head h2 {
      font-family: var(--heavy);
      font-weight: 900;
      letter-spacing: -.02em;
      font-size: clamp(28px, 4vw, 48px);
      margin: 0 0 14px;
      color: var(--black);
    }
    /* InfiniteMenu 根容器：填满左栏剩余区域，承载 WebGL 画布 + 叠加标题/按钮 */
    .study-left #infinite-menu-root {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
    }
    /* 右侧 1/6 留白页（用户另行设计） */
    .study-right {
      flex: 1 1 0;
      min-width: 0;
      border-left: 4px solid var(--black);
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 24px 12px;
      overflow-y: auto;
    }
    .study-page .footer { display: none; }
    /* 画布隐藏阈值与 infinite-menu.css 保持一致（≤1500px 隐藏文字叠加层） */
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    /* 窄屏：隐藏 GooeyNav 文字叠加改用默认堆叠也已由 gooey-nav.css 处理 */
    @media (max-width: 768px) {
      #infinite-menu-root { height: 100%; }
    }
  </style>
</head>
<body class="study-page">

  <!-- 导航 -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">HYHY / GROWTH</a>
      <div class="nav-links" data-gooey-nav></div>
    </div>
  </nav>

  <main class="study-main">
    <div class="study-split">
      <!-- 左 5/6：原有学习页等比缩小、功能全保留（球面笔记菜单） -->
      <div class="study-left">
        <header class="study-head">
          <p class="eyebrow">STUDY / 学习与感悟</p>
          <h2>LEARNING &amp; REFLECTION</h2>
        </header>
        <div id="infinite-menu-root"></div>
      </div>
      <!-- 右 1/6：三个文件夹（资料 / 笔记 / 感悟），点击展开白色文件 -->
      <aside class="study-right">
        <div class="side-folder">
          <div class="folder-scale">
            <div class="folder folder--green" tabindex="0" role="button" aria-label="资料" aria-expanded="false">
              <div class="folder__back">
                <div class="paper"></div>
                <div class="paper"></div>
                <div class="paper"></div>
                <div class="folder__front"></div>
                <div class="folder__front right"></div>
              </div>
            </div>
          </div>
          <div class="side-folder__label">资料</div>
        </div>
        <div class="side-folder">
          <div class="folder-scale">
            <div class="folder folder--yellow" tabindex="0" role="button" aria-label="笔记" aria-expanded="false">
              <div class="folder__back">
                <div class="paper"></div>
                <div class="paper"></div>
                <div class="paper"></div>
                <div class="folder__front"></div>
                <div class="folder__front right"></div>
              </div>
            </div>
          </div>
          <div class="side-folder__label">笔记</div>
        </div>
        <div class="side-folder">
          <div class="folder-scale">
            <div class="folder folder--red" tabindex="0" role="button" aria-label="感悟" aria-expanded="false">
              <div class="folder__back">
                <div class="paper"></div>
                <div class="paper"></div>
                <div class="paper"></div>
                <div class="folder__front"></div>
                <div class="folder__front right"></div>
              </div>
            </div>
          </div>
          <div class="side-folder__label">感悟</div>
        </div>
      </aside>
    </div>
  </main>

  <!-- gl-matrix（UMD，全局 glMatrix）必须在 infinite-menu.js 之前加载 -->
  <script src="gl-matrix-min.js"></script>
  <script src="gooey-nav.js"></script>
  <script src="infinite-menu.js?v=4"></script>
  <script src="folder.js"></script>
  <script>
    (function () {
      'use strict';
      // 笔记区域：每个圆对应一条笔记，封面用静物杂志图填充。
      // 预置 42 条笔记（与 InfiniteMenu 圆盘数量一致），第 1 条为真实笔记，
      // 其余为占位条目；开发者可通过 window.__study.addNote() 无限追加。
      var STUDY_ITEMS = [];
      // 预置真实笔记：键为圆盘序号（1..42），其余为占位条目。
      var SEEDED = {
        1: { link: 'https://c7570a5102a7463ab5806c9f9a108552.gz4.agentos-app.net',
             title: '我的408学习网页', description: '归类：资料', category: '资料' },
        2: { link: 'https://94252049556049838e24ae8b5e7489a0.app.codebuddy.work/',
             title: '大模型为例的开源起步网页', description: '归类：资料', category: '资料' }
      };
      for (var i = 1; i <= 42; i++) {
        var imgPath = 'assets/stilllife/cover_' + String(i).padStart(2, '0') + '.jpg?v=4';
        var seed = SEEDED[i];
        if (seed) {
          STUDY_ITEMS.push({
            image: imgPath,
            link: seed.link,
            title: seed.title,
            description: seed.description,
            category: seed.category
          });
        } else {
          STUDY_ITEMS.push({ image: imgPath, link: null, title: '', description: '', category: '占位' });
        }
      }

      function boot() {
        var root = document.getElementById('infinite-menu-root');
        if (!root) return;
        if (typeof window.InfiniteMenuInit !== 'function') {
          console.error('[study] InfiniteMenuInit 未就绪');
          return;
        }
        window.InfiniteMenuInit(root, STUDY_ITEMS, 1.0);

        // 开发者入口：无限添加笔记（封面循环复用静物池）
        window.__study = {
          items: STUDY_ITEMS,
          addNote: function (note) {
            // note 示例：{ image, link, title, description, category }
            var image = note && note.image;
            if (!image) {
              var idx = STUDY_ITEMS.length + 1;
              image = 'assets/stilllife/cover_' + String(((idx - 1) % 42) + 1).padStart(2, '0') + '.jpg';
            }
            var n = Object.assign({ link: null, title: '', description: '', category: '未分类' }, note || {}, { image: image });
            if (window.__infiniteMenuSketch && typeof window.__infiniteMenuSketch.addItem === 'function') {
              window.__infiniteMenuSketch.addItem(n);
            } else {
              STUDY_ITEMS.push(n);
            }
          }
        };

        // 按类别聚焦：球面随机跳到该类别下的一个笔记
        window.focusNoteByCategory = function (category) {
          var sk = window.__infiniteMenuSketch;
          if (!sk || !sk.instancePositions || !sk.control) return false;
          var idxs = [];
          for (var i = 0; i < STUDY_ITEMS.length; i++) {
            if (STUDY_ITEMS[i] && STUDY_ITEMS[i].category === category) idxs.push(i);
          }
          if (!idxs.length) return false;
          var pick = idxs[Math.floor(Math.random() * idxs.length)];
          var p = sk.instancePositions[pick];
          var negSnap = glMatrix.vec3.negate(glMatrix.vec3.create(), sk.control.snapDirection);
          var fq = sk.control.quatFromVectors(p, negSnap, glMatrix.quat.create());
          if (fq && fq.q) sk.control.orientation = fq.q;
          return true;
        };

      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
