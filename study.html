  <style>
    html, body { height: 100%; }
    body.study-page {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--white);
    }
    .study-page .nav { flex: 0 0 auto; }
    .study-main {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }
    .study-split {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
    }
    .study-left {
      flex: 5 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .study-head {
      flex: 0 0 auto;
      padding: 16px 24px 0;
    }
    .study-head .eyebrow {
      margin-bottom: 4px;
      color: var(--black);
    }
    .study-head h2 {
      font-family: var(--heavy);
      font-weight: 900;
      letter-spacing: -.02em;
      font-size: clamp(28px, 4vw, 48px);
      margin: 0 0 14px;
      color: var(--black);
    }
    /* 左侧：文章封面瀑布流（Masonry）。容器负责滚动，内部 .masonry 由 JS 计算高度 */
    .blog-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 22px 96px;
    }
    /* 旧的行式文章列表已迁移为 Masonry 瀑布流（见 masonry.css / masonry.js） */
    .post-empty {
      padding: 48px 16px;
      text-align: center;
      color: var(--black);
      opacity: .6;
      font-family: var(--mono);
      font-size: 14px;
    }
    /* 右侧：三个文件夹作为分类筛选 */
    .study-right {
      flex: 1 1 0;
      min-width: 0;
      border-left: 4px solid var(--black);
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 24px 12px;
      overflow-y: auto;
    }
    .side-folder {
      cursor: pointer;
      outline: none;
      border-radius: 12px;
      padding: 8px;
      transition: background .15s ease, box-shadow .15s ease;
    }
    .side-folder:hover, .side-folder:focus-visible {
      background: rgba(0,0,0,.05);
    }
    .side-folder.active {
      background: var(--red);
      box-shadow: 0 0 0 3px var(--black);
    }
    .side-folder.active .side-folder__label { color: #fff; }
    .side-folder__label {
      font-family: var(--heavy);
      font-weight: 900;
      font-size: 16px;
      text-align: center;
      margin-top: 6px;
      color: var(--black);
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    @media (max-width: 768px) {
      .study-split { flex-direction: column; }
      .study-right {
        flex-direction: row;
        border-left: none;
        border-top: 4px solid var(--black);
        gap: 18px;
        padding: 12px;
      }
    }
  </style>

  <main class="study-main" id="main">

      <!-- 左：全部文章的可拖拽列表 -->

        </div>

      <!-- 右：三个文件夹（资料 / 笔记 / 感悟）作为分类筛选 -->
      <aside class="study-right" aria-label="分类筛选">
        <div class="side-folder" data-cat="资料" tabindex="0" role="button" aria-label="筛选：资料" aria-pressed="false">

            <div class="folder folder--green">
              <div class="folder__back">

                <div class="paper"></div>

            </div>
          </div>
          <div class="side-folder__label">资料</div>
        </div>
        <div class="side-folder" data-cat="笔记" tabindex="0" role="button" aria-label="筛选：笔记" aria-pressed="false">
          <div class="folder-scale">
            <div class="folder folder--yellow">
              <div class="folder__back">
                <div class="paper"></div>
                <div class="paper"></div>
                <div class="paper"></div>
                <div class="folder__front"></div>
                <div class="folder__front right"></div>
              </div>
            </div>
          </div>
          <div class="side-folder__label">笔记</div>
        </div>
        <div class="side-folder" data-cat="感悟" tabindex="0" role="button" aria-label="筛选：感悟" aria-pressed="false">
          <div class="folder-scale">
            <div class="folder folder--red">
              <div class="folder__back">
                <div class="paper"></div>
                <div class="paper"></div>
                <div class="paper"></div>
                <div class="folder__front"></div>
                <div class="folder__front right"></div>

            </div>

          <div class="side-folder__label">感悟</div>
        </div>
      </aside>
    </div>

  <script src="gooey-nav.js"></script>
  <script>
    (function () {
      'use strict';
      // 学习页左侧：用 React Bits 风格的 Masonry（已移植为 vanilla + GSAP）
      // 展示 posts/manifest.json 中的文章封面瀑布流；右侧三个文件夹按分类筛选。
      var listEl = document.getElementById('blog-list');
      var folders = Array.prototype.slice.call(document.querySelectorAll('.side-folder'));
      var posts = [];
      var filter = null;
      var masonry = null;

      // 为瀑布流分配错落的瓦片高度（封面本身是 600×600 正方形，靠高度差形成瀑布感）
      var HEIGHTS = [300, 240, 360, 280, 320, 260];

      function buildItems(rows) {
        return rows.map(function (p, i) {
          return {
            id: p.slug,
            img: p.cover,
            url: p.url,
            title: p.title,
            height: HEIGHTS[i % HEIGHTS.length]
          };
        });
      }

      function render() {
        var rows = posts.filter(function (p) { return !filter || p.category === filter; });
        if (!rows.length) {
          if (masonry) { masonry.destroy(); masonry = null; }
          listEl.innerHTML = '<div class="post-empty">「' + (filter || '') + '」分类下暂无文章。</div>';
          return;
        }
        if (masonry) { masonry.destroy(); masonry = null; }
        var empty = listEl.querySelector('.post-empty');
        if (empty) empty.parentNode.removeChild(empty);

        if (typeof Masonry === 'undefined') {
          listEl.innerHTML = '<div class="post-empty">Masonry 组件未加载（masonry.js）。</div>';
          return;
        }
        masonry = new Masonry(listEl, {
          animateFrom: 'bottom',
          stagger: 0.06,
          blurToFocus: true,
          scaleOnHover: true,
          hoverScale: 0.95,
          colorShiftOnHover: false
        });
        masonry.setItems(buildItems(rows));
      }

      // 右侧文件夹：点击切换分类筛选（再次点击取消）
      folders.forEach(function (f) {
        function toggle() {
          var cat = f.getAttribute('data-cat');
          if (filter === cat) {
            filter = null;
            folders.forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-pressed', 'false'); });
          } else {
            filter = cat;
            folders.forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-pressed', 'false'); });
            f.classList.add('active'); f.setAttribute('aria-pressed', 'true');
          }
          render();
        }
        f.addEventListener('click', toggle);
        f.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
      });

      fetch('posts/manifest.json')
        .then(function (r) { return r.json(); })
        .then(function (m) {
          posts = (m.posts || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
          render();
        })
        .catch(function () {
          listEl.innerHTML = '<div class="post-empty">无法加载文章列表（posts/manifest.json）。请先运行 blog/sync.py 上传。</div>';
        });
    })();
  </script>
