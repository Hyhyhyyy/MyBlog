<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" width="220" height="150" role="img" aria-label="Hamilton 汉密尔顿 合集封面">
  <defs>
    <radialGradient id="tbg" cx="25%" cy="50%" r="95%">
      <stop offset="0%" stop-color="#3f2b14"/>
      <stop offset="55%" stop-color="#241809"/>
      <stop offset="100%" stop-color="#120b04"/>
    </radialGradient>
    <linearGradient id="tgold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0d894"/>
      <stop offset="50%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#97732c"/>
    </linearGradient>
    <linearGradient id="tcream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf3da"/>
      <stop offset="100%" stop-color="#ecdcb4"/>
    </linearGradient>
    <radialGradient id="tmedal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbf3da"/>
      <stop offset="100%" stop-color="#e2cfa0"/>
    </radialGradient>
  </defs>

  <rect width="220" height="150" fill="url(#tbg)"/>

  <!-- corner ornaments -->
  <g fill="none" stroke="url(#tgold)" stroke-width="1.4">
    <path d="M5 5 L22 5 L5 22 Z"/>
    <path d="M215 5 L198 5 L215 22 Z"/>
    <path d="M5 145 L22 145 L5 128 Z"/>
    <path d="M215 145 L198 145 L215 128 Z"/>
  </g>
  <rect x="9" y="9" width="202" height="132" fill="none" stroke="url(#tgold)" stroke-width="0.8" opacity="0.7"/>

  <!-- left medallion with pistol H -->
  <g transform="translate(64,75)">
    <circle r="52" fill="#160d04"/>
    <circle r="50" fill="none" stroke="url(#tgold)" stroke-width="2"/>
    <circle r="43" fill="url(#tmedal)"/>
    <g fill="#1d1306">
      <rect x="-22" y="-28" width="10" height="54" rx="3"/>
      <polygon points="-24,-28 -14,-28 -17,-38 -21,-38"/>
      <rect x="-26" y="-33" width="5" height="9" rx="1"/>
      <path d="M-12 22 L10 32 L12 24 L-10 14 Z"/>
      <path d="M-15 22 q 7 2 10 8 q -9 2 -14 -5 Z"/>
      <g transform="scale(-1,1)">
        <rect x="-22" y="-28" width="10" height="54" rx="3"/>
        <polygon points="-24,-28 -14,-28 -17,-38 -21,-38"/>
        <rect x="-26" y="-33" width="5" height="9" rx="1"/>
        <path d="M-12 22 L10 32 L12 24 L-10 14 Z"/>
        <path d="M-15 22 q 7 2 10 8 q -9 2 -14 -5 Z"/>
      </g>
      <rect x="-14" y="23" width="28" height="9" rx="4"/>
      <circle cx="-8" cy="32" r="4" fill="none" stroke="#1d1306" stroke-width="2.5"/>
      <circle cx="8" cy="32" r="4" fill="none" stroke="#1d1306" stroke-width="2.5"/>
    </g>
  </g>

  <!-- right text -->
  <text x="112" y="66" fill="url(#tcream)" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="700" letter-spacing="0.5">HAMILTON</text>
  <text x="112" y="84" fill="url(#tgold)" font-family="Georgia,'Times New Roman',serif" font-size="10" letter-spacing="2">&#28450;&#23494;&#23572;&#39039;</text>
  <line x1="112" y1="92" x2="200" y2="92" stroke="url(#tgold)" stroke-width="0.6"/>
  <text x="112" y="106" fill="url(#tcream)" font-family="Georgia,'Times New Roman',serif" font-size="6.8" letter-spacing="1" opacity="0.9">AN&#160;AMERICAN&#160;MUSICAL</text>
  <text x="112" y="119" fill="url(#tgold)" font-family="Georgia,'Times New Roman',serif" font-size="6" letter-spacing="0.7" opacity="0.8">2015&#160;&#183;&#160;LIN-MANUEL&#160;MIRANDA</text>
</svg>
