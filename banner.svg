<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380">
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#ece5d7"/>
    </linearGradient>
    <radialGradient id="tomatoGrad" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ec7e63"/>
      <stop offset="52%" stop-color="#d8583d"/>
      <stop offset="100%" stop-color="#913b2c"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" dy="1">
      <stop offset="0" stop-color="#faf7f0"/>
      <stop offset="1" stop-color="#e7dfcf"/>
    </linearGradient>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#6d655b"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="380" fill="url(#paperBg)"/>
  <rect x="0" y="0" width="1280" height="380" fill="url(#dots)" opacity="0.06"/>
  <rect x="0" y="0" width="1280" height="380" fill="none" stroke="#d8d1c4" stroke-width="2"/>

  <!-- Rule 7a: full-banner light sweep (crosses >=600px) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-460 0" to="1560 0" dur="7s" repeatCount="indefinite"/>
    <rect x="-130" y="-60" width="210" height="500" fill="url(#sweepGrad)" transform="skewX(-14)"/>
  </g>

  <!-- vine path (vinext = vine + next) -->
  <path id="vine" d="M250,300 C430,205 560,300 700,232 S980,300 1180,168"
        fill="none" stroke="#9aa07f" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="680" stroke-dashoffset="680">
    <animate attributeName="stroke-dashoffset" from="680" to="0" dur="2.4s" fill="freeze"/>
  </path>

  <!-- component nodes on vine (React / code identity) -->
  <g transform="translate(470,256)">
    <g opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
      <rect x="-28" y="-19" width="56" height="38" rx="11" fill="url(#nodeGrad)" stroke="#13253a" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#d8583d">&lt;/&gt;</text>
    </g>
  </g>
  <g transform="translate(650,250)">
    <g opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="1.4s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.5s" fill="freeze"/>
      <rect x="-28" y="-19" width="56" height="38" rx="11" fill="url(#nodeGrad)" stroke="#13253a" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#13253a">{ }</text>
    </g>
  </g>
  <g transform="translate(842,278)">
    <g opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="1.8s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.5s" fill="freeze"/>
      <rect x="-28" y="-19" width="56" height="38" rx="11" fill="url(#nodeGrad)" stroke="#13253a" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#13253a">( )</text>
    </g>
  </g>
  <g transform="translate(1040,236)">
    <g opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
      <rect x="-30" y="-19" width="60" height="38" rx="11" fill="url(#nodeGrad)" stroke="#13253a" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#d8583d">fn</text>
    </g>
  </g>

  <!-- data dot flowing along vine -->
  <circle r="7" fill="#d8583d">
    <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#vine"/>
    </animateMotion>
  </circle>

  <!-- Rule 7b: title-area glow pulse (no filter, use simple ellipse) -->
  <ellipse cx="215" cy="118" rx="245" ry="72" fill="#d8583d" opacity="0.12">
    <animate attributeName="opacity" values="0.12;0.30;0.12" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- title -->
  <text x="60" y="132" font-family="Georgia,'Times New Roman','STZhongsong',serif" font-size="92" font-weight="700" fill="#13253a">MyBlog</text>
  <text x="64" y="178" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#d8583d" font-weight="600">Hyhyhyyy 成长档案 · vinext 全栈</text>

  <!-- Rule 7b: underline draw-on under title -->
  <rect x="62" y="148" width="0" height="5" rx="2.5" fill="#d8583d">
    <animate attributeName="width" from="0" to="362" dur="1.4s" begin="0.3s" fill="freeze"/>
  </rect>

  <!-- tomato signature object -->
  <g>
    <circle cx="250" cy="300" r="47" fill="url(#tomatoGrad)"/>
    <ellipse cx="231" cy="283" rx="14" ry="9" fill="#ffffff" opacity="0.35"/>
    <path d="M250,256 L235,238 L252,250 Z" fill="#7f8f4f"/>
    <path d="M250,256 L266,238 L249,250 Z" fill="#8a9a5b"/>
    <path d="M250,256 L227,252 L246,260 Z" fill="#6f7d45"/>
    <path d="M250,256 L273,252 L254,260 Z" fill="#6f7d45"/>
    <rect x="247" y="244" width="6" height="14" rx="3" fill="#5f6b3c"/>
  </g>

  <!-- Rule 7b: seed orbiting tomato (title zone x<=700) -->
  <circle r="4.5" fill="#913b2c">
    <animateMotion dur="4.6s" repeatCount="indefinite">
      <mpath href="#orbitPath"/>
    </animateMotion>
  </circle>
  <path id="orbitPath" d="M182,300 A68,27 0 1,0 318,300 A68,27 0 1,0 182,300" fill="none" stroke="none"/>

  <!-- drifting code brackets in right zone -->
  <text x="900" y="120" font-family="Georgia,serif" font-size="22" fill="#a9ada3" font-weight="700" opacity="0.25">&lt;/&gt;</text>
  <text x="900" y="120" font-family="Georgia,serif" font-size="22" fill="#a9ada3" font-weight="700" opacity="0">
    &lt;/&gt;
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-14; 0,0" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="4.5s" repeatCount="indefinite"/>
  </text>
  <text x="1120" y="300" font-family="Georgia,serif" font-size="20" fill="#a9ada3" font-weight="700" opacity="0.2">{ }</text>
  <text x="1120" y="300" font-family="Georgia,serif" font-size="20" fill="#a9ada3" font-weight="700" opacity="0">
    { }
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,12; 0,0" dur="5.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0" dur="5.2s" repeatCount="indefinite"/>
  </text>
</svg>
