<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380">
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#ece5d7"/>
    </linearGradient>
    <radialGradient id="tomatoGrad" cx="36%" cy="28%" r="80%">
      <stop offset="0" stop-color="#f08a6f"/>
      <stop offset="48%" stop-color="#d8583d"/>
      <stop offset="100%" stop-color="#8f3829"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8583d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#d8583d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8583d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d8583d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d8583d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf6"/>
      <stop offset="1" stop-color="#e7dfcf"/>
    </linearGradient>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#6d655b"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="380" fill="url(#paperBg)"/>
  <rect x="0" y="0" width="1280" height="380" fill="url(#dots)" opacity="0.05"/>
  <!-- warm bokeh for depth -->
  <circle cx="250" cy="300" r="190" fill="url(#warmGlow)"/>
  <circle cx="200" cy="110" r="240" fill="url(#warmGlow)"/>
  <circle cx="1050" cy="250" r="160" fill="url(#warmGlow)"/>
  <!-- editorial frame -->
  <rect x="10" y="10" width="1260" height="360" fill="none" stroke="#d8d1c4" stroke-width="1.5"/>
  <rect x="16" y="16" width="1248" height="348" fill="none" stroke="#cfc5b2" stroke-width="0.8"/>

  <!-- Rule 7a: dual full-width sweeps -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-480 0" to="1580 0" dur="7s" repeatCount="indefinite"/>
    <rect x="-130" y="-60" width="200" height="500" fill="url(#sweepGrad)" transform="skewX(-14)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="1600 0" to="-500 0" dur="11s" repeatCount="indefinite"/>
    <rect x="-110" y="-60" width="170" height="500" fill="url(#redSweep)" transform="skewX(-12)"/>
  </g>

  <!-- floating particles (twinkle + drift) -->
  <g opacity="0.5">
    <circle cx="380" cy="90" r="3" fill="#d8583d">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-18;0,0" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0.5">
    <circle cx="560" cy="320" r="2.5" fill="#7f8f4f">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-22;0,0" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0.5">
    <circle cx="900" cy="80" r="3" fill="#913b2c">
      <animate attributeName="opacity" values="0.2;0.65;0.2" dur="3.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="6.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0.5">
    <circle cx="1150" cy="330" r="2.5" fill="#a9ada3">
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="4.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-20;0,0" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0.5">
    <circle cx="720" cy="60" r="2" fill="#d8583d">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0.5">
    <circle cx="1180" cy="120" r="2" fill="#7f8f4f">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- vine: vinext = vine + next (grows full width) -->
  <path id="vine" d="M250,256 C360,180 480,300 620,230 S880,300 1020,210 S1200,260 1250,200"
        fill="none" stroke="#9aa07f" stroke-width="6.5" stroke-linecap="round"
        stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="2.6s" fill="freeze"/>
  </path>

  <!-- leaves along the vine -->
  <g transform="translate(490,210)">
    <path d="M0,0 Q14,-10 26,-2 Q14,8 0,0 Z" fill="#7f8f4f">
      <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(700,232)">
    <path d="M0,0 Q-14,-10 -26,-2 Q-14,8 0,0 Z" fill="#8a9a5b">
      <animateTransform attributeName="transform" type="rotate" values="6;-6;6" dur="5.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(930,216)">
    <path d="M0,0 Q14,-10 26,-2 Q14,8 0,0 Z" fill="#7f8f4f">
      <animateTransform attributeName="transform" type="rotate" values="-5;7;-5" dur="6.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- code "fruit" nodes on vine -->
  <g transform="translate(430,228)">
    <g opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="1.0s" dur="0.55s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.55s" fill="freeze"/>
      <rect x="-30" y="-20" width="60" height="40" rx="12" fill="url(#nodeGrad)" stroke="#13253a" stroke-width="1.6"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#d8583d">&lt;/&gt;</text>
    </g>
  </g>
  <g transform="translate(565,250)">
    <g opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="1.35s" dur="0.55s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.55s" fill="freeze"/>
      <rect x="-30" y="-20" width="60" height="40" rx="12" fill="url(#nodeGrad)" stroke="#13253a" stroke-width="1.6"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#13253a">{ }</text>
    </g>
  </g>
  <g transform="translate(710,244)">
    <g opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="1.7s" dur="0.55s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.55s" fill="freeze"/>
      <rect x="-30" y="-20" width="60" height="40" rx="12" fill="url(#nodeGrad)" stroke="#13253a" stroke-width="1.6"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#13253a">( )</text>
    </g>
  </g>
  <g transform="translate(880,252)">
    <g opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="2.05s" dur="0.55s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.55s" fill="freeze"/>
      <rect x="-30" y="-20" width="60" height="40" rx="12" fill="url(#nodeGrad)" stroke="#13253a" stroke-width="1.6"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#d8583d">=&gt;</text>
    </g>
  </g>
  <g transform="translate(1050,228)">
    <g opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="2.4s" dur="0.55s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.55s" fill="freeze"/>
      <rect x="-32" y="-20" width="64" height="40" rx="12" fill="url(#nodeGrad)" stroke="#13253a" stroke-width="1.6"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#13253a">&lt;/&gt;</text>
    </g>
  </g>

  <!-- data dot flowing through the full-stack vine -->
  <circle r="7" fill="#d8583d">
    <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#vine"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#913b2c">
    <animateMotion dur="5.5s" begin="2.75s" repeatCount="indefinite" rotate="auto">
      <mpath href="#vine"/>
    </animateMotion>
  </circle>

  <!-- Rule 7b: title-area glow pulse (no filter) -->
  <ellipse cx="215" cy="118" rx="250" ry="76" fill="#d8583d" opacity="0.12">
    <animate attributeName="opacity" values="0.10;0.30;0.10" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- title -->
  <text x="58" y="130" font-family="Georgia,'Times New Roman','STZhongsong',serif" font-size="94" font-weight="700" fill="#13253a">MyBlog</text>
  <text x="62" y="176" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#d8583d" font-weight="600">Hyhyhyyy 成长档案 · vinext 全栈</text>
  <!-- vinext pill badge -->
  <g transform="translate(62,196)">
    <rect x="0" y="0" width="158" height="26" rx="13" fill="#13253a"/>
    <text x="14" y="18" font-family="Georgia,serif" font-size="14" fill="#faf7f0" font-weight="700">vinext</text>
    <text x="62" y="18" font-family="'PingFang SC',sans-serif" font-size="13" fill="#cfc5b2">Next.js 16 · React 19</text>
  </g>

  <!-- Rule 7b: underline draw-on under title -->
  <rect x="60" y="146" width="0" height="5" rx="2.5" fill="#d8583d">
    <animate attributeName="width" from="0" to="366" dur="1.4s" begin="0.3s" fill="freeze"/>
  </rect>

  <!-- tomato signature object (detailed, with gentle pulse) -->
  <g transform="translate(250,300)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.035;1" dur="4s" repeatCount="indefinite"/>
      <!-- body -->
      <circle cx="0" cy="0" r="48" fill="url(#tomatoGrad)"/>
      <!-- ribs -->
      <path d="M0,-44 Q-10,-10 -2,42" fill="none" stroke="#8f3829" stroke-width="1.4" opacity="0.35"/>
      <path d="M0,-44 Q10,-10 2,42" fill="none" stroke="#8f3829" stroke-width="1.4" opacity="0.35"/>
      <path d="M-30,-34 Q-20,0 -26,34" fill="none" stroke="#8f3829" stroke-width="1.2" opacity="0.28"/>
      <path d="M30,-34 Q20,0 26,34" fill="none" stroke="#8f3829" stroke-width="1.2" opacity="0.28"/>
      <!-- highlight -->
      <ellipse cx="-18" cy="-18" rx="15" ry="10" fill="#ffffff" opacity="0.4"/>
      <!-- calyx leaves -->
      <path d="M0,-48 L-16,-66 L1,-54 Z" fill="#7f8f4f"/>
      <path d="M0,-48 L16,-66 L-1,-54 Z" fill="#8a9a5b"/>
      <path d="M0,-48 L-24,-58 L-5,-50 Z" fill="#6f7d45"/>
      <path d="M0,-48 L24,-58 L5,-50 Z" fill="#6f7d45"/>
      <path d="M0,-48 L0,-70 L6,-54 Z" fill="#7f8f4f"/>
      <rect x="-3" y="-62" width="6" height="16" rx="3" fill="#5f6b3c"/>
    </g>
  </g>

  <!-- Rule 7b: seed orbiting tomato (title zone x<=700) -->
  <circle r="4.5" fill="#913b2c">
    <animateMotion dur="4.6s" repeatCount="indefinite">
      <mpath href="#orbitPath"/>
    </animateMotion>
  </circle>
  <path id="orbitPath" d="M182,300 A68,27 0 1,0 318,300 A68,27 0 1,0 182,300" fill="none" stroke="none"/>

  <!-- drifting code glyphs in right zone (subtle) -->
  <text x="980" y="120" font-family="Georgia,serif" font-size="22" fill="#a9ada3" font-weight="700" opacity="0">
    &lt;/&gt;
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="4.5s" repeatCount="indefinite"/>
  </text>
  <text x="1180" y="300" font-family="Georgia,serif" font-size="20" fill="#a9ada3" font-weight="700" opacity="0">
    { }
    <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="5.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="5.2s" repeatCount="indefinite"/>
  </text>
</svg>
